<?php
session_start();
// Redirect logged-in non-admin users to their dashboard
if (isset($_SESSION['user_type']) && $_SESSION['user_type'] !== 'admin') {
    if ($_SESSION['user_type'] === 'client') {
        header("Location: ../client/dashboard.php");
    } elseif ($_SESSION['user_type'] === 'provider') {
        header("Location: ../provider/dashboard.php");
    }
    exit;
}
// If already logged in as admin, redirect to admin dashboard
if (isset($_SESSION['user_type']) && $_SESSION['user_type'] === 'admin') {
    header("Location: dashboard.php");
    exit;
}
?>

<script>
const urlParams = new URLSearchParams(window.location.search);
const error = urlParams.get('error');
const errorDiv = document.getElementById('error-message');

if (error) {
    errorDiv.style.display = 'block';
    switch(error) {
        case 'invalid_credentials':
            errorDiv.innerHTML = '<span class="alert-icon">⚠️</span><div>Invalid email or password.</div>';
            break;
        case 'missing':
            errorDiv.innerHTML = '<span class="alert-icon">⚠️</span><div>Please fill in all fields.</div>';
            break;
    }
}
</script>
